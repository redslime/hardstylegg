version: '3.8'

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hardstylegg
    ports:
      - "3306:3306"
    networks:
      - app-network
  app:
    build:
      dockerfile: dev.Dockerfile
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: ./prisma/
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:80"
    networks:
      - app-network

networks:
  app-network:
    name: app-network