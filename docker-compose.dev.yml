services:
  db:
    ports:
      - "3306:3306"
    restart: unless-stopped

  app:
    image: node:20-alpine
    container_name: hardstylegg-app-dev
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npx prisma migrate dev && npm run dev"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - app-data:/app/data
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "false" # true enables hot reload (but much slower)
      WATCHPACK_POLLING: "false" # true enables hot reload (but much slower)