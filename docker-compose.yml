services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hardstylegg
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  app:
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  app-data:

networks:
  app-network:
    name: app-network