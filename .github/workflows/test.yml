name: Test

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Prisma setup
        run: |
          npx prisma db pull
          npx prisma generate

      - name: Build Nuxt
        run: npm run build

      - name: Archive build
        run: zip -r output.zip .output
