name: Build & Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Generate prisma client
        run: npx prisma@7.9.1 generate

      - name: Build Nuxt
        run: npm run build
        
      - name: Archive build
        run: zip -r output.zip .output

      - name: Upload to VPS via SFTP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "output.zip"
          target: ${{ secrets.VPS_DEPLOY_PATH }}